name: Сборка для Windows

on:
  push:
    branches: [main]
    paths-ignore: ['promo/**', 'docs/**', '.github/workflows/promo-voice.yml', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Скачать TDLib (официальная библиотека Telegram)
        shell: bash
        run: |
          mkdir -p .tmp/tdlib && cd .tmp/tdlib
          npm init -y > /dev/null
          npm install --no-audit --no-fund prebuilt-tdlib@latest
          node -e "
            const fs = require('fs'), path = require('path');
            const p = require('prebuilt-tdlib').getTdjson();
            const dir = path.dirname(p);
            const out = path.resolve('../../src-tauri/lib');
            fs.mkdirSync(out, { recursive: true });
            for (const f of fs.readdirSync(dir)) if (/\.dll$/i.test(f)) fs.copyFileSync(path.join(dir, f), path.join(out, f));
            console.log('::notice title=TDLib::prebuilt-tdlib ' + require('prebuilt-tdlib/package.json').version + ' → ' + fs.readdirSync(out).join(', '));
          "

      - name: Скачать шрифт Inter
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p .tmp/font && cd .tmp/font
          npm pack --silent @fontsource-variable/inter@5 > name.txt
          tar xzf "$(cat name.txt)"
          mkdir -p ../../ui/fonts
          cp package/files/inter-latin-wght-normal.woff2 package/files/inter-cyrillic-wght-normal.woff2 package/files/inter-latin-ext-wght-normal.woff2 package/files/inter-cyrillic-ext-wght-normal.woff2 ../../ui/fonts/
          cp package/LICENSE ../../ui/fonts/LICENSE-Inter.txt || true
          ls ../../ui/fonts

      - name: Номер версии
        shell: bash
        run: |
          # VERSION: первая строка — основа (0.3), вторая — номер запуска, с которого считаем патч.
          BASE=$(sed -n 1p VERSION | tr -d '\r '); FROM=$(sed -n 2p VERSION | tr -d '\r ')
          PATCH=$(( ${{ github.run_number }} - FROM )); [ $PATCH -lt 0 ] && PATCH=0
          V="$BASE.$PATCH"
          node -e "const f='src-tauri/tauri.conf.json',fs=require('fs');const j=JSON.parse(fs.readFileSync(f));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2))" "$V"
          sed -i "0,/^version = .*/s//version = \"$V\"/" src-tauri/Cargo.toml
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "::notice title=Версия::macgram $V pre-alpha"

      - name: Собрать приложение
        shell: bash
        env:
          MACGRAM_API_ID: ${{ secrets.MACGRAM_API_ID }}
          MACGRAM_API_HASH: ${{ secrets.MACGRAM_API_HASH }}
        run: |
          set -o pipefail
          npx --yes @tauri-apps/cli@2 build 2>&1 | tee build.log

      - name: Показать ошибки сборки
        if: failure()
        shell: bash
        run: |
          grep -E "^(error|warning)(\[|:)" -A 6 build.log | head -80 | while IFS= read -r l; do echo "::error::$l"; done
          tail -30 build.log | while IFS= read -r l; do echo "::notice::$l"; done

      - name: Проверить, что TDLib загружается
        shell: bash
        run: |
          export MACTELE_TDJSON="$PWD/src-tauri/lib/tdjson.dll"
          ./src-tauri/target/release/mactele.exe --selftest selftest.txt || true
          head -c 300 selftest.txt | tr '\n' ' ' | sed 's/^/::notice title=Selftest::/'; echo
          grep -q '^OK' selftest.txt

      - name: Сохранить установщик
        uses: actions/upload-artifact@v4
        with:
          name: MacTele-setup
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Опубликовать «Последнюю сборку»
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Релиз не удаляем, а обновляем на месте — чтобы ссылка не пропадала во время сборки.
          FILE=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          SUM=$(sha256sum "$FILE" | cut -d' ' -f1)
          # Что нового — верхний раздел CHANGELOG.md (его показывает окно обновления в программе).
          CHANGES=$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2)
          NOTES=$(printf '%s\n\n%s\n\nСкачайте macgram_%s_x64-setup.exe и запустите. Ранняя версия: возможны ошибки — сообщайте через «Настройки → Сообщить об ошибке».\n\nSHA256: %s\nКоммит: %s' "## Что нового" "$CHANGES" "$APP_VERSION" "$SUM" "${GITHUB_SHA::7}")
          if gh release view latest > /dev/null 2>&1; then
            for a in $(gh release view latest --json assets -q '.assets[].name'); do
              [ "$a" != "$(basename "$FILE")" ] && gh release delete-asset latest "$a" -y || true
            done
            gh release upload latest "$FILE" --clobber
            gh release edit latest --title "macgram $APP_VERSION pre-alpha" --notes "$NOTES" --prerelease
          else
            gh release create latest "$FILE" --title "macgram $APP_VERSION pre-alpha" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
