<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>macgram</title>
<link rel="stylesheet" href="styles/fonts.css">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font: 13px/1.3 "SF Pro Text", "Inter var", "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }
  .card { position: absolute; inset: 6px; display: flex; gap: 11px; align-items: center; padding: 10px 12px; border-radius: 16px; cursor: default;
    background: rgba(246, 246, 248, .96); color: #111; box-shadow: 0 8px 24px rgba(0,0,0,.22), 0 0 0 .5px rgba(0,0,0,.12);
    transform: translateX(110%); transition: transform .45s cubic-bezier(.2, 1.1, .35, 1), opacity .25s; }
  @media (prefers-color-scheme: dark) { .card { background: rgba(38, 38, 42, .96); color: #f2f2f7; box-shadow: 0 8px 24px rgba(0,0,0,.45), 0 0 0 .5px rgba(255,255,255,.12); } .text { color: #b8b8c0 !important; } }
  .card.in { transform: none; }
  .card.out { transform: translateX(110%); opacity: .2; }
  .av { width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 16px; background-size: cover; background-position: center; }
  .body { flex: 1; min-width: 0; }
  .top { display: flex; align-items: center; gap: 6px; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .app { font-size: 11px; opacity: .55; flex: none; }
  .text { margin-top: 2px; color: #555; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .x { position: absolute; top: 6px; left: 6px; width: 18px; height: 18px; border-radius: 50%; border: 0; background: rgba(0,0,0,.45); color: #fff; font-size: 11px; line-height: 18px; padding: 0; opacity: 0; transition: opacity .15s; cursor: pointer; }
  .card:hover .x { opacity: 1; }
  /* «Ответить» — как кнопка в баннере macOS: появляется при наведении */
  .row { display: flex; gap: 11px; align-items: center; width: 100%; }
  .reply-btn { flex: none; height: 26px; padding: 0 11px; border-radius: 13px; border: 0; font-size: 12px; font-weight: 500; line-height: 26px; font-family: inherit;
    background: rgba(0,0,0,.07); color: inherit; opacity: 0; transform: scale(.9); transition: opacity .15s, transform .2s cubic-bezier(.2,1.2,.35,1), background .15s; cursor: pointer; }
  .card:hover .reply-btn { opacity: 1; transform: none; }
  .reply-btn:hover { background: rgba(0,0,0,.13); }
  .card { flex-direction: column; justify-content: center; }
  .reply { display: none; width: 100%; gap: 6px; align-items: center; margin-top: 8px; }
  .card.replying .reply { display: flex; }
  .card.replying .reply-btn { display: none; }
  .reply input { flex: 1; min-width: 0; height: 30px; border-radius: 15px; border: .5px solid rgba(0,0,0,.15); background: rgba(255,255,255,.9); padding: 0 12px; font-size: 13px; font-family: inherit; color: inherit; outline: none; }
  .reply input:focus { border-color: #2481cc; box-shadow: 0 0 0 2px rgba(36,129,204,.25); }
  .send { width: 30px; height: 30px; border-radius: 50%; border: 0; background: #2481cc; color: #fff; font-size: 15px; cursor: pointer; flex: none; }
  .send:disabled { opacity: .4; }
  @media (prefers-color-scheme: dark) { .reply-btn { background: rgba(255,255,255,.1); } .reply-btn:hover { background: rgba(255,255,255,.18); } .reply input { background: rgba(0,0,0,.25); border-color: rgba(255,255,255,.15); } }
</style>
</head>
<body>
  <div class="card" id="card">
    <button class="x" id="x" title="Закрыть">✕</button>
    <div class="row">
      <div class="av" id="av"></div>
      <div class="body"><div class="top"><div class="title" id="title"></div><div class="app">macgram</div></div><div class="text" id="text"></div></div>
      <button class="reply-btn" id="reply">Ответить</button>
    </div>
    <div class="reply"><input id="input" placeholder="Ответить…" maxlength="4096"/><button class="send" id="send" title="Отправить" disabled>↑</button></div>
  </div>
<script src="js/toast.js"></script>
</body>
</html>
