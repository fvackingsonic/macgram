<!doctype html>
<html lang="ru" class="style-glass">
<head>
<meta charset="utf-8">
<title>macgram</title>
<link rel="stylesheet" href="styles/fonts.css">
<style>
  /* Баннер уведомления в стиле macgram: жидкое стекло, как пузыри и панели в приложении —
     прозрачная заливка (насколько — решает ползунок «Прозрачность»), яркий ободок с бликом,
     мягкий внутренний свет и тень. С «Размытием» под окном — настоящее размытие Windows (акрил). */
  :root { --tint: 250, 250, 252; --a: .62; --fg: #0b0b0c; --sub: rgba(0,0,0,.66); --muted: rgba(0,0,0,.45);
    --spec: rgba(255,255,255,.95); --line: rgba(255,255,255,.4); --spec2: rgba(255,255,255,.7); --edge: rgba(0,0,0,.08);
    --btn: rgba(0,0,0,.07); --btn-h: rgba(0,0,0,.13); --input: rgba(255,255,255,.7); --accent: #2481cc; }
  html.dark { --tint: 28, 28, 32; --fg: #fff; --sub: rgba(255,255,255,.78); --muted: rgba(255,255,255,.5);
    --spec: rgba(255,255,255,.6); --line: rgba(255,255,255,.16); --spec2: rgba(255,255,255,.36); --edge: rgba(255,255,255,.06);
    --btn: rgba(255,255,255,.12); --btn-h: rgba(255,255,255,.2); --input: rgba(0,0,0,.28); }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font: 13px/1.3 "SF Pro Text", "Inter var", "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--fg); }
  .card { position: absolute; inset: 10px; display: flex; flex-direction: column; justify-content: center; padding: 10px 14px 10px 12px; cursor: default;
    border-radius: 20px; isolation: isolate;
    background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0) 55%), rgba(var(--tint), var(--a));
    box-shadow: 0 8px 24px rgba(0,0,0,.22), 0 1px 3px rgba(0,0,0,.12), inset 0 0 18px rgba(255,255,255,.08);
    opacity: 0; transform: translateX(var(--from, 46px)) scale(.96); transition: transform .55s cubic-bezier(.2, 1.2, .3, 1), opacity .22s; }
  /* ободок с бликом — как у стекла в macgram */
  .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 2;
    background: linear-gradient(135deg, var(--spec) 0%, var(--line) 24%, var(--line) 76%, var(--spec2) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  html.left { --from: -46px; }
  /* с размытием Windows окно само и есть карточка: углы скругляет система */
  html.blur .card { inset: 0; border-radius: 8px; box-shadow: inset 0 0 18px rgba(255,255,255,.06); transform: translateY(-6px); }
  html.blur .card.out { transform: translateY(-6px); }
  /* «Как на Mac» — плотная карточка без стеклянного ободка */
  html.style-mac .card { border-radius: 18px; background: rgba(var(--tint), var(--a)); box-shadow: 0 6px 18px rgba(0,0,0,.2), 0 0 0 .5px var(--edge), inset 0 .5px 0 rgba(255,255,255,.5); }
  html.style-mac .card::before { display: none; }
  .card.in { transform: none; opacity: 1; }
  .card.out { opacity: 0; transform: translateX(var(--from, 46px)) scale(.97); transition-duration: .3s; }
  .row { display: flex; gap: 11px; align-items: center; width: 100%; min-width: 0; }
  .av { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 15px;
    background-size: cover; background-position: center; position: relative; }
  .av .badge { position: absolute; right: -3px; bottom: -3px; width: 16px; height: 16px; border-radius: 4px; background: url(icons/macgram-logo.svg) center/cover; box-shadow: 0 0 0 1.5px rgba(var(--tint), .9); }
  html.no-avatar .av { width: 30px; height: 30px; border-radius: 7px; background: url(icons/macgram-logo.svg) center/cover !important; color: transparent; }
  html.no-avatar .av .badge { display: none; }
  .body { flex: 1; min-width: 0; }
  .top { display: flex; align-items: baseline; gap: 6px; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .when { font-size: 11px; color: var(--muted); flex: none; }
  .text { margin-top: 1px; color: var(--sub); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  html.size-s { font-size: 12px; } html.size-s .av { width: 32px; height: 32px; } html.size-s .text { -webkit-line-clamp: 1; }
  html.size-l { font-size: 14px; } html.size-l .av { width: 46px; height: 46px; } html.size-l .text { -webkit-line-clamp: 3; }
  .x { position: absolute; top: -6px; left: -6px; width: 20px; height: 20px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; z-index: 3;
    background: rgba(var(--tint), .96); color: var(--sub); font-size: 10px; line-height: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.25), 0 0 0 .5px var(--edge);
    opacity: 0; transform: scale(.7); transition: opacity .15s, transform .2s cubic-bezier(.2,1.3,.35,1); }
  html.blur .x { top: 5px; left: 5px; }
  .card:hover .x { opacity: 1; transform: none; }
  .reply-btn { flex: none; height: 26px; padding: 0 11px; border-radius: 13px; border: 0; font-size: 12px; font-weight: 500; font-family: inherit;
    background: var(--btn); color: inherit; cursor: pointer; display: none; transition: background .15s; box-shadow: inset 0 0 0 .5px var(--line); }
  .card:hover .reply-btn { display: block; }
  .card:hover .when { display: none; }
  html.no-reply .reply-btn { display: none !important; }
  .reply-btn:hover { background: var(--btn-h); }
  .reply { display: none; width: 100%; gap: 6px; align-items: center; margin-top: 9px; }
  .card.replying .reply { display: flex; }
  .card.replying .reply-btn { display: none !important; }
  .reply input { flex: 1; min-width: 0; height: 30px; border-radius: 15px; border: .5px solid var(--line); background: var(--input); padding: 0 12px; font-size: 13px; font-family: inherit; color: inherit; outline: none; }
  .reply input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(36,129,204,.25); }
  .send { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; flex: none; }
  .send:disabled { opacity: .4; }
  @media (prefers-reduced-motion: reduce) { .card, .card.out { transition-duration: .01s; } }
</style>
</head>
<body>
  <div class="card" id="card">
    <button class="x" id="x" title="Закрыть">✕</button>
    <div class="row">
      <div class="av" id="av"><i class="badge"></i></div>
      <div class="body"><div class="top"><div class="title" id="title"></div><div class="when">сейчас</div></div><div class="text" id="text"></div></div>
      <button class="reply-btn" id="reply">Ответить</button>
    </div>
    <div class="reply"><input id="input" placeholder="Ответить…" maxlength="4096"/><button class="send" id="send" title="Отправить" disabled>↑</button></div>
  </div>
<script src="js/toast.js"></script>
</body>
</html>
